name: review CI/CD

on:
  workflow_dispatch:
    inputs:
      stage:
        description: デプロイステージ
        required: true
        default: develop
        type: choice
        options:
          - develop
  pull_request:
    paths:
      - "api/**"
      - "core/**"
      - "db/sea_orm_entities/**"
      - "docs/**"
      - "frontend/**"
      - "review/**"
      - "integration-test/**"
      - ".github/workflows/review-cicd.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Rustツールチェーンのセットアップ
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: AWS SAM CLIのセットアップ
        uses: aws-actions/setup-sam@v3

      - name: デプロイステージの設定
        id: stage
        run: |
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
            echo "commitid=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "stage=develop" >> "$GITHUB_OUTPUT"
            echo "commitid=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "service_name=contactform-api-public" >> "$GITHUB_OUTPUT"

      - name: sam validate --lint の実行
        env:
          AWS_DEFAULT_REGION: ap-northeast-3
        run: sam validate --lint --template-file review/template.yaml

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: 結合テスト用Dockerネットワークの作成
        run: |
          docker network inspect integration-test-network >/dev/null 2>&1 \
          || docker network create integration-test-network

      - name: PostgreSQLの起動
        run: |
          for attempt in {1..3}; do
            if docker run --rm --name postgres \
              --network integration-test-network \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=postgres \
              -p 5432:5432 \
              -d postgres:16-alpine; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "PostgreSQLコンテナの起動に3回失敗しました。"
              exit 1
            fi

            echo "PostgreSQLコンテナの起動に失敗しました。5秒後に再試行します。（${attempt}/3）"
            docker rm -f postgres >/dev/null 2>&1 || true
            sleep 5
          done
          until docker exec postgres pg_isready -U postgres -d postgres; do
            sleep 1
          done

      - name: Liquibaseでローカルマイグレーション
        run: |
          docker run --rm \
            -e LIQUIBASE_HUB_MODE=off \
            -e JAVA_OPTS="-DLAMBDA_ROLE=local -DAWS_ACCOUNT_ID=123456789012" \
            --network integration-test-network \
            -v "${{ github.workspace }}:/workspace" \
            liquibase/liquibase:4.33.0 \
            --search-path=/workspace \
            --changelog-file=db/liquibase/changelog.xml \
            --contexts=local \
            --url=jdbc:postgresql://postgres:5432/postgres \
            --username=postgres \
            --password=postgres \
            update

      - name: Install Extra CLI Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin,cargo-lambda

      - name: カバレッジレポートの生成
        run: cargo tarpaulin --out Html -- --include-ignored

      - name: ziglang pytest allure-pytest requests psycopg2-binaryのインストール
        run: pip install ziglang pytest allure-pytest requests psycopg2-binary

      - name: SAM アプリケーションのビルド
        env:
          CARGO_ENCODED_RUSTFLAGS: '--cfg=feature="local-dev"'
        run: |
          sam build --template-file api/template.yaml --parameter-overrides Architecture=x86_64

      - name: sam local start-api による結合テストの実行
        run: |
          bash integration-test/run-integration-tests.sh

      - name: Allureレポートの生成
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Rustドキュメントの生成
        run: cargo doc --no-deps

      - name: OpenAPI仕様の生成
        working-directory: api/lambda
        run: cargo run --bin export_openapi

      - name: 依存関係のインストール
        working-directory: frontend
        run: npm ci

      - name: フロントエンドのビルド
        working-directory: frontend
        run: npm run build

      - name: Storybookのビルド
        working-directory: frontend
        run: npm run build-storybook

      - name: TypeDocの生成
        working-directory: frontend
        run: npm run build:typedoc

      - name: docsのINDEXにレビュー資料リンクを追加
        working-directory: docs
        run: |
          cat <<'EOF' >> README.md
          ---

          ## レビュー用資料一覧

          レビュー時に参照する資料の一覧です。

          ### Rustドキュメント

          <ul>
            <li><a target="_blank" href="./rust-doc/application/index.html">Rustドキュメント(ビジネスロジック：application層)</a></li>
            <li><a target="_blank" href="./rust-doc/infrastructure/index.html">Rustドキュメント(ビジネスロジック：infrastructure層)</a></li>
            <li><a target="_blank" href="./rust-doc/presentation/index.html">Rustドキュメント(ビジネスロジック：presentation層)</a></li>
            <li><a target="_blank" href="./rust-doc/domain/index.html">Rustドキュメント(ビジネスロジック：domain層)</a></li>
            <li><a target="_blank" href="./rust-doc/bootstrap/index.html">Rustドキュメント(Lambdaハンドラー)</a></li>
            <li><a target="_blank" href="./rust-doc/sea_orm_entities/index.html">Rustドキュメント(Sea Orm Entities)</a></li>
            <li><a target="_blank" href="./coverage/tarpaulin-report.html">カバレッジレポート</a></li>
          </ul>

          ### APIドキュメント

          <ul>
            <li><a target="_blank" href="./openapi.yaml">OpenAPI仕様</a></li>
            <li><a target="_blank" href="./stoplight/index.html">API仕様書(Stoplight Elements)</a></li>
            <li><a target="_blank" href="./rapidoc/index.html">API仕様書(RapiDoc)</a></li>
          </ul>

          ### 結合テストドキュメント

          <ul>
            <li><a target="_blank" href="./integration-tests/index.html">結合テストレポート(Allure)</a></li>
          </ul>

          ### フロントエンドドキュメント

          <ul>
            <li><a target="_blank" href="./storybook/index.html">Storybook</a></li>
            <li><a target="_blank" href="./typedoc/index.html">TypeDoc</a></li>
          </ul>

          EOF

      - name: docsディレクトリをHTMLに変換
        working-directory: docs
        run: |
          docker run --rm -u $(id -u):$(id -g) -v .:/honkit ghcr.io/nishidemasami/markdown-docs:v1.2.3 npx honkit build

      - name: レビュー資料の収集
        run: |
          mkdir -p review-output/coverage review-output/rust-doc review-output/storybook review-output/typedoc review-output/integration-tests
          cp -r docs/_book/. review-output/
          cp tarpaulin-report.html review-output/coverage/tarpaulin-report.html
          cp -r target/doc/. review-output/rust-doc/
          cp api/openapi.yaml review-output/
          cp -r frontend/storybook-static/. review-output/storybook/
          cp -r frontend/typedoc/. review-output/typedoc/
          cp -r allure-history/. review-output/integration-tests/

      - name: Generate Stoplight Elements
        run: |
          mkdir -p review-output/stoplight
          cat <<'STOPLIGHT' > review-output/stoplight/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <script src="https://unpkg.com/@stoplight/elements@9.0.23/web-components.min.js" crossorigin="anonymous"></script>
              <link rel="stylesheet" href="https://unpkg.com/@stoplight/elements/styles.min.css">
            </head>
            <body>
              <elements-api apiDescriptionUrl="../openapi.yaml" router="hash" />
            </body>
          </html>
          STOPLIGHT

      - name: Generate RapiDoc HTML
        run: |
          mkdir -p review-output/rapidoc
          cat <<'RAPIDOC' > review-output/rapidoc/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <script src="https://unpkg.com/rapidoc@9.3.8/dist/rapidoc-min.js" crossorigin="anonymous"></script>
            </head>
            <body>
              <rapi-doc style="visibility: visible" id="doc" spec-url="../openapi.yaml" render-style="read" allow-try="true" allow-authentication="true" persist-auth="true" theme="light" show-header="false" api-key-name="Authorization" api-key-location="header"></rapi-doc>
            </body>
          </html>
          RAPIDOC

      - name: アーティファクトのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: review-docs
          path: review-output/

  deploy:
    name: deploy
    needs: validate
    runs-on: ubuntu-24.04-arm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: AWSクレデンシャルの設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-3

      - name: AWS SAM CLIのセットアップ
        uses: aws-actions/setup-sam@v3

      - name: デプロイステージの設定
        id: stage
        run: |
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
            echo "commitid=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "subdirectoryname=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "deployment_environment=${{ github.event.inputs.stage }}レビュー資料" >> "$GITHUB_OUTPUT"
          else
            echo "stage=develop" >> "$GITHUB_OUTPUT"
            echo "commitid=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "subdirectoryname=pull_request/${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "deployment_environment=プルリクエスト#${{ github.event.pull_request.number }}レビュー資料" >> "$GITHUB_OUTPUT"
          fi
          echo "service_name=contactform-api-public" >> "$GITHUB_OUTPUT"

      - name: sam deploy の実行
        run: |
          sam deploy \
            --template-file review/template.yaml \
            --stack-name "${{ steps.stage.outputs.service_name }}-review-${{ steps.stage.outputs.stage }}" \
            --role-arn "${{ secrets.SAM_DEPLOY_ROLE_ARN }}" \
            --parameter-overrides \
              ServiceName="${{ steps.stage.outputs.service_name }}" \
              Stage="${{ steps.stage.outputs.stage }}" \
              SecretReferer="${{ secrets.SECRET_REFERER }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3

      - name: アーティファクトのダウンロード
        uses: actions/download-artifact@v4
        with:
          name: review-docs
          path: review-output/

      - name: スタック情報の取得
        id: cloudformation_info
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.stage.outputs.service_name }}-review-${{ steps.stage.outputs.stage }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ReviewBucketName'].OutputValue" \
            --output text)
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

          CLOUDFRONT_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.stage.outputs.service_name }}-review-${{ steps.stage.outputs.stage }}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomainName'].OutputValue" \
            --output text)
          echo "review_cloudfront_domain=$CLOUDFRONT_DOMAIN" >> "$GITHUB_OUTPUT"

          FRONTEND_CLOUDFRONT_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.stage.outputs.service_name }}-frontend-${{ steps.stage.outputs.stage }}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomainName'].OutputValue" \
            --output text)
          echo "frontend_cloudfront_domain=$FRONTEND_CLOUDFRONT_DOMAIN" >> "$GITHUB_OUTPUT"

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.stage.outputs.service_name }}-review-${{ steps.stage.outputs.stage }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ReviewCloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: openapi.yamlのAPIエンドポイント情報の追加
        run: |
          echo "" >> review-output/openapi.yaml
          echo "servers:" >> review-output/openapi.yaml
          echo "- url: https://${{ steps.cloudformation_info.outputs.frontend_cloudfront_domain }}" >> review-output/openapi.yaml

      - name: GitHub Deploymentの作成
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ steps.stage.outputs.commitid }}',
              environment: '${{ steps.stage.outputs.deployment_environment }}',
              auto_merge: false,
              required_contexts: [],
              description: 'レビュー資料の公開'
            });
            return result.data.id;
          result-encoding: string

      - name: S3へのアップロード
        run: |
          aws s3 sync review-output/ \
            s3://${{ steps.cloudformation_info.outputs.bucket_name }}/${{ steps.stage.outputs.subdirectoryname }}/ \
            --delete

      - name: CloudFrontのキャッシュ削除
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudformation_info.outputs.distribution_id }} \
            --paths "/${{ steps.stage.outputs.subdirectoryname }}/*"

      - name: GitHub Deployment Statusの更新
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://${{ steps.cloudformation_info.outputs.review_cloudfront_domain }}/${{ steps.stage.outputs.subdirectoryname }}/index.html',
              description: 'レビュー資料の公開完了'
            });

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure'
            })
