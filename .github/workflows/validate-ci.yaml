name: CI Validation

on:
  push:
    branches:
      - main
      - develop
      - release
  pull_request:
    branches:
      - main
      - develop
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Verify & Validate
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install Extra CLI Tools
        uses: taiki-e/install-action@v2
        with:
          tool: sea-orm-cli,cargo-tarpaulin,cargo-lambda

      - name: ziglangのインストール
        run: pip3 install ziglang --break-system-packages

      - name: Check Rust format
        run: cargo fmt -- --check

      - name: Cargo compilation check
        run: cargo check --all-targets

      - name: Cargo clippy lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verusによる形式手法検証（domain / presentation）
        run: |
          VERUS_VERSION="0.2026.11.22.1ce6a59"
          ARCH="$(uname -m)"
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            VERUS_ASSET="verus-${VERUS_VERSION}-arm64-linux.zip"
            VERUS_DIR="verus-arm64-linux"
            VERUS_TOOLCHAIN="1.100.0-aarch64-unknown-linux-gnu"
          else
            VERUS_ASSET="verus-${VERUS_VERSION}-x86-linux.zip"
            VERUS_DIR="verus-x86-linux"
            VERUS_TOOLCHAIN="1.100.0-x86_64-unknown-linux-gnu"
          fi
          mkdir -p "$HOME/.local/verus"
          curl -fsSL "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/${VERUS_ASSET}" -o /tmp/verus.zip
          unzip -q -o /tmp/verus.zip -d "$HOME/.local/verus"
          rm -f /tmp/verus.zip
          rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal --no-self-update
          "$HOME/.local/verus/${VERUS_DIR}/verus" --crate-type=lib --no-cheating core/domain/src/inquiry/validation.rs
          "$HOME/.local/verus/${VERUS_DIR}/verus" --crate-type=lib --no-cheating core/presentation/src/lambda/http_decision.rs

      - name: Kaniによる形式手法検証（domain / application / presentation）
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
          cargo kani -p domain --output-format terse -j
          cargo kani -p application --output-format terse -j
          kani --output-format terse core/presentation/src/lambda/http_decision.rs

      - name: 結合テスト用Dockerネットワークの作成
        run: |
          docker network inspect integration-test-network >/dev/null 2>&1 \
          || docker network create integration-test-network

      - name: PostgreSQLの起動
        run: |
          for attempt in {1..3}; do
            if docker run --rm --name postgres \
              --network integration-test-network \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=postgres \
              -p 5432:5432 \
              -d postgres:16-alpine; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "PostgreSQLコンテナの起動に3回失敗しました。"
              exit 1
            fi

            echo "PostgreSQLコンテナの起動に失敗しました。5秒後に再試行します。（${attempt}/3）"
            docker rm -f postgres >/dev/null 2>&1 || true
            sleep 5
          done
          until docker exec postgres pg_isready -U postgres -d postgres; do
            sleep 1
          done

      - name: Run Liquibase migrations
        run: |
          docker run --rm \
            -e LIQUIBASE_HUB_MODE=off \
            -e JAVA_OPTS="-DLAMBDA_ROLE=local -DAWS_ACCOUNT_ID=123456789012" \
            --network integration-test-network \
            -v "${{ github.workspace }}:/workspace" \
            liquibase/liquibase:4.33.0 \
            --search-path=/workspace \
            --changelog-file=db/liquibase/changelog.xml \
            --contexts=local \
            --url=jdbc:postgresql://postgres:5432/postgres \
            --username=postgres \
            --password=postgres \
            update

      - name: Run all workspace tests
        run: cargo test --all-features -- --include-ignored

      - name: AWS SAM CLIのセットアップ
        uses: aws-actions/setup-sam@v3

      - name: sam validate --lint の実行
        env:
          AWS_DEFAULT_REGION: ap-northeast-3
        run: |
          sam validate --lint --template-file api/template.yaml
          sam validate --lint --template-file db/template.yaml
          sam validate --lint --template-file retained/template.yaml

      - name: SAM アプリケーションのビルド
        env:
          CARGO_ENCODED_RUSTFLAGS: '--cfg=feature="local-dev"'
        run: |
          sam build --template-file api/template.yaml

      - name: sam local start-api による結合テストの実行
        run: |
          bash integration-test/run-integration-tests.sh
