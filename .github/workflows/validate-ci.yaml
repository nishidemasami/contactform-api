name: CI Validation

on:
  push:
    branches:
      - main
      - develop
      - release
  pull_request:
    branches:
      - main
      - develop
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Verify & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Extra CLI Tools
        uses: taiki-e/install-action@v2
        with:
          tool: sea-orm-cli,cargo-tarpaulin,cargo-lambda

      - name: ziglangのインストール
        run: pip3 install ziglang --break-system-packages

      - name: Check Rust format
        run: cargo fmt -- --check

      - name: Cargo compilation check
        run: cargo check --all-targets

      - name: Cargo clippy lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 結合テスト用Dockerネットワークの作成
        run: |
          docker network inspect integration-test-network >/dev/null 2>&1 \
          || docker network create integration-test-network

      - name: PostgreSQLの起動
        run: |
          for attempt in {1..3}; do
            if docker run --rm --name postgres \
              --network integration-test-network \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=postgres \
              -p 5432:5432 \
              -d postgres:16-alpine; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "PostgreSQLコンテナの起動に3回失敗しました。"
              exit 1
            fi

            echo "PostgreSQLコンテナの起動に失敗しました。5秒後に再試行します。（${attempt}/3）"
            docker rm -f postgres >/dev/null 2>&1 || true
            sleep 5
          done
          until docker exec postgres pg_isready -U postgres -d postgres; do
            sleep 1
          done

      - name: Run Liquibase migrations
        run: |
          docker run --rm \
            -e LIQUIBASE_HUB_MODE=off \
            -e JAVA_OPTS="-DLAMBDA_ROLE=local -DAWS_ACCOUNT_ID=123456789012" \
            --network integration-test-network \
            -v "${{ github.workspace }}:/workspace" \
            liquibase/liquibase:4.33.0 \
            --search-path=/workspace \
            --changelog-file=db/liquibase/changelog.xml \
            --contexts=local \
            --url=jdbc:postgresql://postgres:5432/postgres \
            --username=postgres \
            --password=postgres \
            update

      - name: Run all workspace tests
        run: cargo test --all-features -- --include-ignored

      - name: AWS SAM CLIのセットアップ
        uses: aws-actions/setup-sam@v3

      - name: sam validate --lint の実行
        env:
          AWS_DEFAULT_REGION: ap-northeast-3
        run: |
          sam validate --lint --template-file api/template.yaml
          sam validate --lint --template-file db/template.yaml
          sam validate --lint --template-file retained/template.yaml

      - name: SAM アプリケーションのビルド
        env:
          CARGO_ENCODED_RUSTFLAGS: '--cfg=feature="local-dev"'
        run: |
          sam build --template-file api/template.yaml

      - name: sam local start-api による結合テストの実行
        run: |
          bash integration-test/run-integration-tests.sh
