name: retained CI/CD

on:
  push:
    branches:
      - develop
      - release
    paths:
      - "retained/**"
      - ".github/workflows/retained-cicd.yaml"
  pull_request:
    branches:
      - develop
      - release
    paths:
      - "retained/**"
      - ".github/workflows/retained-cicd.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS SAM CLIのセットアップ
        uses: aws-actions/setup-sam@v3

      - name: sam validate --lint の実行
        env:
          AWS_DEFAULT_REGION: ap-northeast-3
        run: |
          sam validate --lint --template-file retained/template.yaml

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release')
    environment: ${{ github.ref == 'refs/heads/release' && 'release' || 'develop' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS SAM CLIのセットアップ
        uses: aws-actions/setup-sam@v3

      - name: ステージの判定
        id: info
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "stage=develop" >> "$GITHUB_OUTPUT"
          else
            echo "stage=release" >> "$GITHUB_OUTPUT"
          fi
          echo "service_name=contactform-api-public" >> "$GITHUB_OUTPUT"

      - name: AWSクレデンシャルの設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-3

      - name: sam deploy の実行
        run: |
          sam deploy \
            --template-file retained/template.yaml \
            --stack-name "${{ steps.info.outputs.service_name }}-retained-${{ steps.info.outputs.stage }}" \
            --role-arn "${{ secrets.SAM_DEPLOY_ROLE_ARN }}" \
            --parameter-overrides \
              ServiceName="${{ steps.info.outputs.service_name }}" \
              Stage="${{ steps.info.outputs.stage }}" \
              SecretReferer="${{ secrets.SECRET_REFERER }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3
