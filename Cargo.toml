[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[workspace]
members = [
  "api/lambda",
  "core/application",
  "core/domain",
  "core/infrastructure",
  "core/presentation",
  "db/sea_orm_entities",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
sea-orm = { version = "2", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1", features = ["serde", "v7"] }
anyhow = "1"
aurora-dsql-sqlx-connector = { version = "0.2", features = ["pool"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lambda_runtime = "1"
aws_lambda_events = { version = "1", default-features = false, features = [
  "apigw",
  "builders",
] }
http = "1"
utoipa = { version = "5", features = ["uuid", "yaml"] }
rstest = "0.26"
proptest = "1"