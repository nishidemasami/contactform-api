openapi: 3.1.0
info:
  title: contactform-api
  description: コンタクトフォームAPI
  version: 0.1.0
paths:
  /api/v1/inquiries:
    get:
      tags:
      - Inquiry
      summary: GET /api/v1/inquiries - 問い合わせ一覧取得（未実装）
      operationId: find_inquiries_doc
      responses:
        '501':
          description: 未実装
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inquiry:
    post:
      tags:
      - Inquiry
      summary: POST /api/v1/inquiry - 問い合わせ作成
      operationId: create_inquiry_doc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
        required: true
      responses:
        '201':
          description: 問い合わせ作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInquiryResponse'
        '400':
          description: 入力エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 重複エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateInquiryRequest:
      type: object
      description: |-
        問い合わせ作成リクエスト

        ## フィールドと正規化・検証仕様

        | フィールド | 型 | 生JSONスキーマ制約 | ドメイン正規化・検証ルール |
        |---|---|---|---|
        | `name` | `String` | `1..=100`文字 | 正規化なし（`trim`前 `1..=100`文字・空白のみ不可・制御文字不可） |
        | `email` | `String` | `6`文字以上（前後空白許容） | 前後のUnicode空白を `trim` 正規化後、`6..=254`文字かつRFC 5321/5322/1123準拠メール形式 |
        | `message` | `String` | `1..=5000`文字 | 正規化なし（`trim`前 `1..=5000`文字・空白のみ不可・改行タブ以外の制御文字不可） |
      required:
      - name
      - email
      - message
      properties:
        email:
          type: string
          description: 連絡先メールアドレス（生入力は前後のUnicode空白を許容。サーバー側で前後 `trim` 正規化後に 6〜254文字・RFC準拠メール形式を検証）
          minLength: 6
        message:
          type: string
          description: 問い合わせ本文（`trim`前 1〜5000文字、空白のみ不可・改行タブ以外の制御文字不可）
          maxLength: 5000
          minLength: 1
        name:
          type: string
          description: 氏名（`trim`前 1〜100文字、空白のみ不可・制御文字不可）
          maxLength: 100
          minLength: 1
    CreateInquiryResponse:
      type: object
      description: 問い合わせ作成レスポンス
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: 生成された問い合わせID
    ErrorResponse:
      type: object
      description: エラーレスポンス
      required:
      - message
      properties:
        message:
          type: string
          description: エラーメッセージ
tags:
- name: Inquiry
  description: 問い合わせAPI
