openapi: 3.1.0
info:
  title: contactform-api
  description: コンタクトフォームAPI
  version: 0.1.0
paths:
  /api/v1/inquiries:
    get:
      tags:
      - Inquiry
      summary: GET /api/v1/inquiries - 問い合わせ一覧取得（未実装）
      operationId: find_inquiries_doc
      responses:
        '501':
          description: 未実装
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inquiry:
    post:
      tags:
      - Inquiry
      summary: POST /api/v1/inquiry - 問い合わせ作成
      operationId: create_inquiry_doc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
        required: true
      responses:
        '201':
          description: 問い合わせ作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInquiryResponse'
        '400':
          description: 入力エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 重複エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateInquiryRequest:
      type: object
      description: |-
        問い合わせ作成リクエスト

        ## フィールド

        | フィールド | 型 | 文字数制限 | 説明 |
        |---|---|---|---|
        | `name` | `String` | `trim`前 1〜100文字 | 氏名（空白のみ不可・制御文字不可） |
        | `email` | `String` | `trim`後 6〜254文字 | 連絡先メールアドレス（RFC準拠形式） |
        | `message` | `String` | `trim`前 1〜5000文字 | 問い合わせ本文（空白のみ不可・改行タブ以外の制御文字不可） |
      required:
      - name
      - email
      - message
      properties:
        email:
          type: string
          format: email
          description: 連絡先メールアドレス（前後空白 `trim` 後 6〜254文字、メール形式）
          maxLength: 254
          minLength: 6
        message:
          type: string
          description: 問い合わせ本文（`trim`前 1〜5000文字）
          maxLength: 5000
          minLength: 1
        name:
          type: string
          description: 氏名（`trim`前 1〜100文字）
          maxLength: 100
          minLength: 1
    CreateInquiryResponse:
      type: object
      description: 問い合わせ作成レスポンス
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: 生成された問い合わせID
    ErrorResponse:
      type: object
      description: エラーレスポンス
      required:
      - message
      properties:
        message:
          type: string
          description: エラーメッセージ
tags:
- name: Inquiry
  description: 問い合わせAPI
